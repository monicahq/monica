name: Static analysis

# Nothing here writes anything back to the repository.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

  # Also on pushes to main, so anything that lands without going through a pull
  # request is still checked.
  # push:
  #   branches: [main]

  workflow_dispatch:

concurrency:
  group: Static ${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: ./.github/actions/php

      - name: Run phpstan
        run: vendor/bin/phpstan analyse

  code-style:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: ./.github/actions/php

      - name: Run pint
        run: vendor/bin/pint --test

  assets:
    name: Build assets (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JS environment
        uses: ./.github/actions/js
