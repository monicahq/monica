name: Unit tests

# The tests only need to read the code they run against.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/actions/js/action.yml
      - .github/actions/php/action.yml
      - .github/workflows/tests.yml
      - '**/*.php'
      - '**/*.js'
      - '**/*.css'
      - .env.example
      - composer.json
      - composer.lock
      - package.json
      - bun.lock
      - pint.json
      - vite.config.js
      - phpstan.neon
      - phpunit.xml

  # Also on pushes to main, so anything that lands without going through a pull
  # request is still tested.
  # push:
  #   branches: [main]
  # release:
  #   types: [created]

  workflow_dispatch:

concurrency:
  group: Build ${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  #############
  # Run tests
  #############
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: PHP ${{ matrix.php-version }} + ${{ matrix.connection }} + ${{ matrix.suite }}

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5']
        connection: [sqlite, mysql, pgsql]
        suite: [Actions, Unit, Feature]

    # Selects the database connection for every step, including the plain
    # `artisan migrate` (phpunit.xml pins DB_CONNECTION to "testing", so this
    # env is what actually drives the connection at runtime).
    env:
      DB_CONNECTION: ${{ matrix.connection }}
      MEILISEARCH_HOST: http://127.0.0.1:7700
      MEILISEARCH_KEY: testing-master-key

    # The reference search engine. Matching, tolerance of typing mistakes and
    # ranking are decided by the engine, so the tests that prove them run
    # against a real one; every other test runs on Scout's null engine.
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.56
        env:
          MEILI_MASTER_KEY: testing-master-key
          MEILI_NO_ANALYTICS: true
        ports:
          - 7700:7700

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: ./.github/actions/php
        with:
          php-version: ${{ matrix.php-version }}
          connection: ${{ matrix.connection }}


      # The tests render Blade views, so @vite needs a manifest. Building the
      # real assets is the job of the Static analysis workflow, so a stub is
      # enough here.
      - name: Prepare environment
        run: |
          cp tests/.env.ci.${{ matrix.connection }} .env
          mkdir -p public/build/assets
          : > public/build/assets/app.js
          : > public/build/assets/app.css
          cat > public/build/manifest.json <<'JSON'
          {
              "resources/js/app.js": {"file": "assets/app.js", "src": "resources/js/app.js", "isEntry": true},
              "resources/css/app.css": {"file": "assets/app.css", "src": "resources/css/app.css", "isEntry": true}
          }
          JSON

      - name: Create sqlite database
        if: matrix.connection == 'sqlite'
        run: touch database/database.sqlite

      - name: Create mysql database
        if: matrix.connection == 'mysql'
        run: |
          sudo systemctl start mysql.service
          mysql --protocol=tcp -u root -proot -e "CREATE DATABASE IF NOT EXISTS monica CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Create pgsql database
        if: matrix.connection == 'pgsql'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --command="CREATE USER monica PASSWORD 'secret'" --command="\du"
          sudo -u postgres psql --command="ALTER USER monica CREATEDB"
          sudo -u postgres createdb --owner=monica monica
          PGPASSWORD=secret psql --username=monica --host=localhost --list monica

      - name: Generate key
        run: php artisan key:generate

      - name: Generate OAuth keys
        run: php artisan passport:keys --no-interaction

      - name: Run migrations
        run: php artisan migrate --no-interaction -vvv

      # Paratest gives each process its own database, named after the one above
      # with the process number appended, and migrates it. The connection user
      # therefore has to be allowed to create databases, which is why the
      # postgres step above grants CREATEDB.
      - name: Run tests
        run: php artisan test --parallel --testsuite=${{ matrix.suite }}
