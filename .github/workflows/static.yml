name: Static analysis

# Nothing here writes anything back to the repository.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/actions/js/action.yml
      - .github/actions/php/action.yml
      - .github/workflows/static.yml
      - '**/*.php'
      - '**/*.js'
      - '**/*.css'
      - phpstan.neon
      - composer.json
      - composer.lock

  # Also on pushes to main, so anything that lands without going through a pull
  # request is still checked.
  # push:
  #   branches: [main]

  workflow_dispatch:

concurrency:
  group: Static ${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: ./.github/actions/php

      - name: Run phpstan
        run: vendor/bin/phpstan analyse

  code-style:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: 8.5

      - name: Get pint version
        id: pint
        run: |
          echo "version=$(composer show laravel/pint --locked --format=json | jq -r '.versions[0]' | sed 's/v//')" >> $GITHUB_OUTPUT

      - name: laravel-pint
        uses: aglipanci/laravel-pint-action@36de00d5f5a8a4e12d443e01671daa12a18f4c79 # v2.6.0
        with:
          configPath: pint.json
          pintVersion: ${{ steps.pint.outputs.version }}

  assets:
    name: Build assets (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JS environment
        uses: ./.github/actions/js

      - name: Install JS dependencies
        run: bun install --frozen-lockfile
